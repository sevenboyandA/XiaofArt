<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="林小肥个人绘画与视觉艺术作品展。">
    <meta name="theme-color" content="#0a0a0a">
    <title>林小肥作品展</title>
    <script>
        try {
            if (sessionStorage.getItem('xiaofart-skip-entry-once') === '1') {
                sessionStorage.removeItem('xiaofart-skip-entry-once');
                document.documentElement.classList.add('skip-entry');
            }
        } catch (error) {}
    </script>
    <link rel="stylesheet" href="gallery.css">
</head>
<body class="home-gallery is-at-entry site-page">
    <div class="entry-gate" id="entryGate" role="button" tabindex="0" aria-label="欢迎来到林小肥作品展，点击或按任意键进入">
        <div class="entry-aura" aria-hidden="true"></div>
        <p class="entry-signature">LIN XIAOFEI · ART EXHIBITION</p>
        <h1 class="entry-title">
            <span class="entry-welcome">欢迎来到</span>
            <span class="entry-name">林小肥</span>
            <span class="entry-show">作品展</span>
        </h1>
        <p class="entry-hint"><span aria-hidden="true"></span> 点击或按任意键进入</p>
        <p class="entry-edition" aria-hidden="true">NO. 01<br>MMXXVI</p>
    </div>

    <header class="site-header exhibition-header" id="siteHeader">
        <a href="index.html" class="brand" aria-label="林小肥作品展首页" data-skip-entry>
            <span class="brand-mark" aria-hidden="true"></span>
            <span>林小肥作品展</span>
        </a>
        <div class="exhibition-header-actions">
            <nav class="site-nav" aria-label="主要导航">
                <a href="index.html" class="is-active" aria-current="page" data-skip-entry>首页</a>
                <a href="about.html">作者介绍</a>
            </nav>
            <button class="theme-button" id="themeToggle" type="button" aria-label="切换到浅色主题" aria-pressed="false">
                <span aria-hidden="true"></span>
            </button>
        </div>
    </header>

    <main class="exhibition-main" id="exhibitionMain" aria-hidden="true">
        <section class="orbit-hero" id="orbitHero" aria-label="林小肥作品展">
            <div class="orbit-scene" id="orbitScene" aria-label="环形作品系列书架">
                <div class="orbit-track" id="orbitTrack"></div>
                <div class="orbit-floor" aria-hidden="true"></div>
                <div class="orbit-halo" aria-hidden="true"></div>
            </div>

            <div class="orbit-footer">
                <div class="orbit-active-info">
                    <p class="eyebrow" id="orbitMeta"></p>
                    <h2 id="orbitActiveTitle"></h2>
                    <p id="orbitDescription"></p>
                </div>
                <button type="button" class="orbit-open-mobile" id="orbitOpenMobile">
                    查看系列 <span aria-hidden="true">↗</span>
                </button>
                <div class="orbit-controls">
                    <button type="button" id="orbitPrevious" aria-label="上一个系列">←</button>
                    <div class="orbit-counter"><strong id="orbitCurrent">01</strong><span></span><em id="orbitTotal">00</em></div>
                    <button type="button" id="orbitNext" aria-label="下一个系列">→</button>
                </div>
            </div>
        </section>
    </main>

    <dialog class="project-dialog" id="projectDialog" aria-label="作品详情">
        <div class="dialog-shell">
            <header class="dialog-header">
                <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true"></span><span>林小肥</span></a>
                <button class="dialog-close" id="projectClose" type="button" aria-label="关闭项目">关闭 <span aria-hidden="true">×</span></button>
            </header>
            <article class="project-content">
                <header class="project-intro">
                    <div>
                        <p class="eyebrow" id="projectMeta"></p>
                        <h2 id="projectTitle"></h2>
                    </div>
                    <p id="projectDescription"></p>
                </header>
                <div class="project-gallery" id="projectGallery"></div>
                <nav class="project-slide-controls" aria-label="系列图片导航">
                    <div class="project-slide-indicator" id="projectSlideIndicator"></div>
                </nav>
                <nav class="project-pagination" aria-label="相邻项目">
                    <button type="button" id="previousProject">← 上一个项目</button>
                    <button type="button" id="nextProject">下一个项目 →</button>
                </nav>
            </article>
        </div>
    </dialog>

    <dialog class="lightbox" id="lightbox" aria-label="画作全屏查看">
        <header class="lightbox-header">
            <p id="lightboxLabel"></p>
            <button type="button" id="lightboxClose" aria-label="关闭全屏查看">关闭 ×</button>
        </header>
        <button class="lightbox-arrow lightbox-previous" id="lightboxPrevious" type="button" aria-label="上一张">←</button>
        <figure>
            <img id="lightboxImage" alt="">
            <figcaption id="lightboxCaption"></figcaption>
        </figure>
        <button class="lightbox-arrow lightbox-next" id="lightboxNext" type="button" aria-label="下一张">→</button>
    </dialog>

    <noscript><p class="noscript">请启用 JavaScript 以浏览林小肥作品展。</p></noscript>
    <script src="site-data.js"></script>
    <script src="site-transition.js"></script>
    <script src="gallery-app.js"></script>
</body>
</html>
