<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | XiaofArt</title>
    <script>
        try {
            const transitionData = JSON.parse(sessionStorage.getItem('xiaofartProjectTransition') || 'null');
            if (transitionData && transitionData.src) {
                const safeSrc = String(transitionData.src).replace(/["\\\n\r]/g, '');
                document.documentElement.classList.add('project-transition-primed');
                document.documentElement.style.setProperty('--transition-image-src', `url("${safeSrc}")`);
            }
        } catch (error) {}
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursorFollower"></div>

    <nav class="detail-nav">
        <a href="portfolio.html" class="nav-logo">XiaofArt</a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="portfolio.html">PROJECTS</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
            <div class="theme-toggle" id="themeToggle" title="切换主题"></div>
        </div>
    </nav>

    <main class="detail-page">
        <div class="detail-hero">
            <img id="detailHeroImg" src="" alt="Project Hero">
        </div>

        <div class="detail-content">
            <div class="detail-header">
                <h1 class="detail-title" id="detailTitle"></h1>
                <div class="detail-meta">
                    <div class="detail-meta-item">
                        <span class="detail-meta-label">Category</span>
                        <span class="detail-meta-value" id="detailCategory"></span>
                    </div>
                    <div class="detail-meta-item">
                        <span class="detail-meta-label">Year</span>
                        <span class="detail-meta-value" id="detailYear"></span>
                    </div>
                    <div class="detail-meta-item">
                        <span class="detail-meta-label">Services</span>
                        <span class="detail-meta-value" id="detailServices"></span>
                    </div>
                </div>
            </div>

            <p class="detail-description" id="detailDescription"></p>

            <div class="detail-gallery" id="detailGallery"></div>

            <div class="detail-info-grid">
                <div class="detail-info-item">
                    <h4>Client</h4>
                    <p id="detailClient"></p>
                </div>
                <div class="detail-info-item">
                    <h4>Location</h4>
                    <p id="detailLocation"></p>
                </div>
                <div class="detail-info-item">
                    <h4>Project</h4>
                    <p> XiaofArt Studio</p>
                </div>
            </div>

            <div style="margin-top: 4rem; text-align: center;">
                <button id="backBtn" class="back-button">
                    <span>← Back to Projects</span>
                </button>
            </div>
        </div>
    </main>

    <script src="site-data.js"></script>
    <script src="script.js"></script>
    <style>
        .back-button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem 2rem;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .back-button:hover {
            background-color: var(--color-orange);
            border-color: var(--color-orange);
        }
    </style>
</body>
</html>
