<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | XiaofArt</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursorFollower"></div>
    
    <nav class="nav">
        <a href="portfolio.html" class="nav-logo">XiaofArt</a>
        <div class="nav-right">
            <ul class="nav-links">
                <li><a href="portfolio.html">PROJECTS</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html" class="active">CONTACT</a></li>
            </ul>
            <div class="theme-toggle" id="themeToggle" title="切换主题"></div>
        </div>
    </nav>

    <main class="contact-section">
        <div class="contact-container">
            <div class="contact-content">
                <h1 class="contact-title">Get in Touch</h1>
                <p class="contact-subtitle">Have a project in mind or just want to say hello? Feel free to reach out.</p>
                
                <div class="contact-info">
                    <div class="contact-item">
                        <h3 class="contact-label">Email</h3>
                        <a href="mailto:hello@xiaofart.com" class="contact-value">hello@xiaofart.com</a>
                    </div>
                    <div class="contact-item">
                        <h3 class="contact-label">Phone</h3>
                        <a href="tel:+861234567890" class="contact-value">+86 123 4567 890</a>
                    </div>
                    <div class="contact-item">
                        <h3 class="contact-label">Location</h3>
                        <p class="contact-value">Shanghai, China</p>
                    </div>
                </div>
                
                <div class="contact-social">
                    <h3 class="contact-label">Connect</h3>
                    <div class="social-links">
                        <a href="#" class="social-link">Instagram</a>
                        <a href="#" class="social-link">Behance</a>
                        <a href="#" class="social-link">Dribbble</a>
                        <a href="#" class="social-link">LinkedIn</a>
                    </div>
                </div>
            </div>
            <div class="contact-form">
                <h2 class="form-title">Send a Message</h2>
                <form class="message-form">
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="Your email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" id="subject" class="form-input" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" class="form-textarea" placeholder="Your message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="form-button">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
