<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — 林小肥作品展管理</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .register-card {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <link href="admin-theme.css?v=20260720-4" rel="stylesheet">
    <script src="admin-shell.js" defer></script>
</head>
<body class="admin-auth flex items-center justify-center min-h-screen px-4">
    <div class="register-card rounded-2xl p-8 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <div class="logo mb-2">林小肥作品展</div>
            <p class="text-gray-600">创建后台管理账号</p>
        </div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                <input type="text" id="name" name="name" class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none" placeholder="请输入用户名" required>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                <input type="email" id="email" name="email" class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none" placeholder="请输入邮箱地址" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input type="password" id="password" name="password" class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none" placeholder="请输入密码" required minlength="8">
            </div>

            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="input-field w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none" placeholder="请再次输入密码" required>
            </div>

            <div>
                <button type="submit" class="btn-primary w-full py-2 px-4 rounded-lg text-white font-medium">
                    注册
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                已有账号? <a href="login.html" class="text-indigo-600 hover:text-indigo-500 font-medium">立即登录</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('注册成功，请登录');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message || '注册失败');
                }
            } catch (error) {
                console.error('注册错误:', error);
                alert('网络错误，请稍后重试');
            }
        });
    </script>
</body>
</html>
